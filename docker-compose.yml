name: lexi

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lexi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lexi_dev}
      POSTGRES_DB: ${POSTGRES_DB:-lexi}
    ports: ["5432:5432"]
    volumes: [pg_data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lexi}"]
      interval: 5s
      retries: 10

  qdrant:
    image: qdrant/qdrant:v1.11.0
    ports: ["6333:6333"]
    volumes: [qdrant_data:/qdrant/storage]

  api:
    build: ./services/api
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-lexi}:${POSTGRES_PASSWORD:-lexi_dev}@postgres:5432/${POSTGRES_DB:-lexi}
      QDRANT_URL: http://qdrant:6333
      STORAGE_DIR: /data/storage
      CORS_ORIGINS: '["http://localhost:4000"]'
    volumes:
      - ./services/api/app:/srv/app
      - storage:/data/storage
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      qdrant: { condition: service_started }

  web:
    build: ./apps/web
    env_file: .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-lexi}:${POSTGRES_PASSWORD:-lexi_dev}@postgres:5432/${POSTGRES_DB:-lexi}
      # El navegador usa localhost; el servidor de Next (dentro de Docker) usa el nombre del servicio
      NEXT_PUBLIC_API_URL: http://localhost:8000/api/v1
      API_INTERNAL_URL: http://api:8000/api/v1
      # Sin esto, en Windows Next no detecta los cambios de los archivos montados
      WATCHPACK_POLLING: "true"
    volumes:
      - ./apps/web/src:/app/src
      - ./apps/web/prisma:/app/prisma
      # Montado para que un cambio en la configuración no obligue a reconstruir la imagen
      - ./apps/web/next.config.mjs:/app/next.config.mjs
    ports: ["4000:3000"]
    depends_on:
      postgres: { condition: service_healthy }
      api: { condition: service_started }

volumes:
  pg_data:
  qdrant_data:
  storage:
