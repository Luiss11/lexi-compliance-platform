name: Reporte de bug
description: Algo no funciona como se espera
title: "[BUG] "
labels: ["bug"]
body:
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducir
    validations: { required: true }
  - type: textarea
    id: esperado
    attributes:
      label: Resultado esperado vs. obtenido
    validations: { required: true }
  - type: dropdown
    id: severidad
    attributes:
      label: Severidad
      options: ["Crítica", "Alta", "Media", "Baja"]
  - type: input
    id: entorno
    attributes:
      label: Entorno
      placeholder: "local / staging · navegador · commit"
