name: Caso de alucinación (QA IA)
description: Respuesta del asistente sin fundamento, cita incorrecta o fallback que no se disparó
title: "[TC-AI-HALLUCINATION] "
labels: ["qa", "ai"]
body:
  - type: textarea
    id: pregunta
    attributes:
      label: Pregunta enviada
    validations: { required: true }
  - type: textarea
    id: respuesta
    attributes:
      label: Respuesta obtenida (copiar completa)
    validations: { required: true }
  - type: input
    id: score
    attributes:
      label: Mejor score de similitud reportado
  - type: dropdown
    id: tipo
    attributes:
      label: Tipo de falla
      options:
        - "Respondió con score < 0.75 (debía usar fallback)"
        - "Cita a página/cláusula incorrecta"
        - "Información no presente en los documentos"
        - "Fuga entre tenants"
    validations: { required: true }
  - type: input
    id: documento
    attributes:
      label: Documento del dataset relacionado
